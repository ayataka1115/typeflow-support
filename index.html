<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Typeflowの公式サポート情報です。">
  <title>Typeflow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <p class="eyebrow">Mac用クリップボード管理</p>
    <h1>Typeflow</h1>
    <p class="lead">コピー履歴と定型文を、必要なときにすぐ呼び出せます。</p>
  </header>
  <main>
    <section class="card">
      <h2>できること</h2>
      <ul>
        <li>テキスト、画像、ファイルのコピー履歴を検索</li>
        <li>メニューバーから最近のコピー10件を選択</li>
        <li>よく使う文章を定型文として保存</li>
        <li>複数の項目を決めた順にコピー</li>
        <li>保存内容をMacの中で暗号化</li>
      </ul>
    </section>
    <h2>プライバシー</h2>
    <p>コピー内容と設定はMacの中に保存され、開発者や外部サービスへ送信されません。利用状況も収集しません。</p>
    <nav class="nav" aria-label="関連ページ">
      <a href="privacy.html">プライバシーポリシー</a>
      <a href="support.html">サポート</a>
    </nav>
  </main>
  <footer>© 2026 Typeflow</footer>
